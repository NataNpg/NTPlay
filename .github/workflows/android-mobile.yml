name: Android celular (APK)
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-native/**'
      - '.github/workflows/android-mobile.yml'
      # tv-native/** de propósito NÃO entra: a propagação de uma correção do motor da TV
      # para o celular é manual (workflow_dispatch), para você decidir quando acontece.

permissions:
  contents: write

jobs:
  mobile:
    name: APK celular (Kotlin + Compose + Media3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Número da versão (sobe sozinho a cada compilação)
        run: echo "NT_VERSION_CODE=$((1 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Testes do gerador do motor (não precisa de Android)
        shell: bash
        run: |
          if ls mobile-native/tools/test_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s mobile-native/tools -p 'test_*.py' -v
          else
            echo "::notice::ainda não há testes do gerador — nada a rodar"
          fi

      - name: Chave de assinatura (GitHub Secrets)
        env:
          KS_B64: ${{ secrets.NT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NT_KS_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error title=Faltam os secrets::Crie NT_KEYSTORE_B64 e NT_KS_PASS em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ntplay-release.jks"
          echo "NT_KS_FILE=$RUNNER_TEMP/ntplay-release.jks" >> "$GITHUB_ENV"
          echo "NT_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        working-directory: mobile-native
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > ../gradle.log 2>&1
          code=$?
          tail -n 40 ../gradle.log
          if [ $code -ne 0 ]; then
            echo "::error title=gradle falhou::$(grep -E '^e: |error:|What went wrong|Caused by|FAILED|Dependency |minSdk|minCompileSdk|requires' -A2 ../gradle.log | head -c 3500 | tr '\n' '|')"
            exit $code
          fi

      - name: Testes de unidade (JVM, sem emulador)
        shell: bash
        working-directory: mobile-native
        run: |
          set +e
          gradle :app:testReleaseUnitTest --no-daemon > ../test.log 2>&1
          code=$?
          tail -n 30 ../test.log
          if [ $code -ne 0 ]; then
            echo "::error title=testes falharam::$(grep -E 'FAILED|expected|AssertionError' -A2 ../test.log | head -c 3000 | tr '\n' '|')"
            exit $code
          fi

      - run: cp mobile-native/app/build/outputs/apk/release/app-release.apk NTPlay-Celular.apk

      - name: Arquivo de versão (usado pela atualização automática do app)
        run: |
          code=$NT_VERSION_CODE
          name=$(grep -oP 'versionName = "\K[^"]+' mobile-native/app/build.gradle.kts)
          min=$(tr -d '[:space:]' < mobile-native/min_version)
          echo "{\"code\":$code,\"name\":\"$name\",\"min\":${min:-0}}" > mob-version.json
          cat mob-version.json

      - uses: actions/upload-artifact@v4
        with:
          name: NTPlay-Celular
          path: NTPlay-Celular.apk

      # A release só é publicada a partir da main. Em ramo de trabalho a compilação roda e o APK
      # fica no artefato acima, sem sobrescrever a mob-latest que os usuários baixam.
      - name: Publicar na Release (só na main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mob-latest --yes --cleanup-tag || true
          gh release create mob-latest NTPlay-Celular.apk mob-version.json --title "NTPlay Celular (Android)" --notes "APK para celular Android. Baixe o arquivo NTPlay-Celular.apk abaixo." --target ${{ github.sha }}
