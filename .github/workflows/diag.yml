name: diag servidor
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice title=dns::$(getent ahosts teleflixhd.club | awk '{print $1}' | sort -u | tr '\n' ' ') | 1.1.1.1: $(dig +short teleflixhd.club @1.1.1.1 | tr '\n' ' ') | 8.8.8.8: $(dig +short teleflixhd.club @8.8.8.8 | tr '\n' ' ')"
          echo "::notice title=headers::$(curl -sI -m 30 http://teleflixhd.club/ | tr '\r\n' '  ' | head -c 600)"
          echo "::notice title=whois-ns::$(dig +short NS teleflixhd.club | tr '\n' ' ')"
