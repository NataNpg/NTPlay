name: Android TV nativo (APK)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tv-native/**'
      - '.github/workflows/android-tv.yml'

permissions:
  contents: write

jobs:
  tv:
    name: APK Android TV (Kotlin + Compose + Media3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        shell: bash
        working-directory: tv-native
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > ../gradle.log 2>&1
          code=$?
          tail -n 40 ../gradle.log
          if [ $code -ne 0 ]; then
            echo "::error title=gradle falhou::$(grep -E '^e: |error:|What went wrong|Caused by|FAILED|Dependency |minSdk|minCompileSdk|requires' -A2 ../gradle.log | head -c 3500 | tr '\n' '|')"
            exit $code
          fi
      - run: cp tv-native/app/build/outputs/apk/release/app-release.apk NTPlay-TV.apk
      - name: Arquivo de versão (usado pela atualização automática do app)
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' tv-native/app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' tv-native/app/build.gradle.kts)
          min=$(tr -d '[:space:]' < tv-native/min_version)
          echo "{\"code\":$code,\"name\":\"$name\",\"min\":${min:-0}}" > tv-version.json
          cat tv-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: NTPlay-TV-nativo
          path: NTPlay-TV.apk
      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest NTPlay-TV.apk tv-version.json --title "NTPlay TV (Android TV nativo)" --notes "APK para Android TV. Baixe o arquivo NTPlay-TV.apk abaixo." --target ${{ github.sha }}
