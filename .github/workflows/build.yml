name: Build NTPlay
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  android:
    name: Android (celular + Android TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Endereço da página de envio (QR code)
        shell: bash
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          echo "window.NT_SEND_BASE=\"https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/\";window.NT_DEFAULT_M3U=\"\";" > www/config.js
      - run: npm install
      - name: Preparar projeto Android
        shell: bash
        run: |
          set +e
          npm run android:init > android-init.log 2>&1
          code=$?
          cat android-init.log
          if [ $code -ne 0 ]; then echo "::error title=android:init falhou::$(tail -c 1500 android-init.log | tr '\n' '|' )"; exit $code; fi
      - name: Compilar APK
        shell: bash
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > ../gradle.log 2>&1
          code=$?
          tail -n 60 ../gradle.log
          if [ $code -ne 0 ]; then echo "::error title=gradle falhou::$(grep -E 'error|Error|FAILED|What went wrong|Caused by' -A2 ../gradle.log | head -c 1500 | tr '\n' '|')"; exit $code; fi
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk NTPlay-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: NTPlay-Android, path: NTPlay-Android.apk }

  ios:
    name: iOS (IPA sem assinatura)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Endereço da página de envio (QR code)
        shell: bash
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          echo "window.NT_SEND_BASE=\"https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/\";window.NT_DEFAULT_M3U=\"\";" > www/config.js
      - run: npm install
      - run: npm run ios:init
      - name: Compilar sem assinatura
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p Payload && cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry ../../NTPlay-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: NTPlay-iOS, path: NTPlay-iOS-unsigned.ipa }

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Endereço da página de envio (QR code)
        shell: bash
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          echo "window.NT_SEND_BASE=\"https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/\";window.NT_DEFAULT_M3U=\"\";" > www/config.js
      - run: npm install
      - run: npm run pc:build
        env:
          GH_TOKEN: ''
      - uses: actions/upload-artifact@v4
        with: { name: NTPlay-Windows, path: dist/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
