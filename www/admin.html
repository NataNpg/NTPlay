<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NTPlay - Painel Unificado</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
    }
    .menu-abas {
      display: flex;
      background-color: #1f1f1f;
      border-bottom: 2px solid #333;
    }
    .botao-aba {
      flex: 1;
      padding: 15px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .botao-aba:hover {
      background-color: #2a2a2a;
      color: #fff;
    }
    .botao-aba.ativo {
      color: #00e676;
      border-bottom: 3px solid #00e676;
      background-color: #2a2a2a;
    }
    .conteudo-aba {
      display: none;
      width: 100%;
      height: calc(100vh - 55px);
    }
    .conteudo-aba.visivel {
      display: block;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <nav class="menu-abas">
    <button class="botao-aba ativo" onclick="alternarAba('admin', this)">Painel Admin</button>
    <button class="botao-aba" onclick="alternarAba('contas', this)">Gerenciar Contas</button>
  </nav>

  <!-- Seção do Painel Admin -->
  <div id="aba-admin" class="conteudo-aba visivel">
    <!-- Se você já tiver o código do admin, ele pode ficar aqui diretamente, ou carregado como abaixo -->
    <iframe src="admin.html"></iframe>
  </div>

  <!-- Seção de Contas -->
  <div id="aba-contas" class="conteudo-aba">
    <iframe src="contas.html"></iframe>
  </div>

  <script>
    function alternarAba(aba, elemento) {
      document.querySelectorAll('.conteudo-aba').forEach(conteudo => {
        conteudo.classList.remove('visivel');
      });
      document.querySelectorAll('.botao-aba').forEach(btn => {
        btn.classList.remove('ativo');
      });

      document.getElementById('aba-' + aba).classList.add('visivel');
      elemento.classList.add('ativo');
    }
  </script>

</body>
</html>
